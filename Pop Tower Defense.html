<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Pop Tower Defense</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap">
<style>
  :root {
    color-scheme: dark;
    --bg: #0d1116; --panel: #171d26; --panel-2: #1f2733; --line: rgba(255,255,255,.09);
    --fg: #e9eef5; --muted: #9aa6b6; --gold: #f5c542; --danger: #f05252; --ok: #34d399;
    --display: "Fredoka", "Trebuchet MS", system-ui, sans-serif;
    --text: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  [hidden] { display: none !important; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.4 var(--text); overflow: hidden; -webkit-tap-highlight-color: transparent; }
  button { font: inherit; color: inherit; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }

  #rot { height: 100%; }
  @media (orientation: portrait) {
    #rot { position: fixed; top: 0; left: 0; width: 100vh; height: 100vw; transform-origin: 0 0; transform: translateX(100vw) rotate(90deg); }
  }
  .app { height: 100%; padding: 8px 12px; display: grid; gap: 10px; grid-template-columns: minmax(0,1fr) minmax(250px,330px); grid-template-rows: auto minmax(0,1fr); }
  .hud { grid-column: 1 / -1; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
  .stat { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 6px 12px; min-width: 84px; }
  .stat span { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .stat b { font: 600 22px/1.1 var(--display); font-variant-numeric: tabular-nums; }
  .ctrl { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  .btn { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 10px 14px; font-weight: 600; }
  .btn.main { background: var(--gold); color: #1b1505; border-color: transparent; font: 600 16px var(--display); }
  .btn.on { border-color: var(--gold); color: var(--gold); }

  .board { grid-column: 1; grid-row: 2; min-height: 0; overflow: hidden; display: flex; align-items: center; justify-content: center; background: var(--panel); border: 1px solid var(--line); border-radius: 16px; }
  canvas { display: block; touch-action: manipulation; cursor: crosshair; }

  .side { grid-column: 2; grid-row: 2; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding-right: 2px; }
  .shop { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 8px; }
  .shh { grid-column: 1 / -1; margin: 6px 2px 0; font: 600 12px var(--text); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .tw { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 6px 8px; display: flex; align-items: center; gap: 8px; min-width: 0; text-align: left; }
  .tw.hero { border-color: rgba(245,197,66,.35); }
  .tw canvas { width: 46px; height: 46px; flex: 0 0 auto; }
  .tw .txt { display: flex; flex-direction: column; min-width: 0; }
  .tw span { font-weight: 600; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tw em { font-style: normal; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .tw small { color: var(--gold); font: 600 16px var(--display); font-variant-numeric: tabular-nums; }
  .tw.on { border-color: var(--gold); background: var(--panel-2); }

  .sel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
  .selhead { display: flex; gap: 10px; align-items: center; }
  .selhead canvas { width: 56px; height: 56px; flex: 0 0 auto; }
  .sel h3 { margin: 0; font: 600 18px var(--display); }
  .sel p { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .stline { font-size: 12px !important; color: var(--fg) !important; opacity: .8; }
  .xp { height: 8px; background: rgba(255,255,255,.1); border-radius: 99px; overflow: hidden; }
  .xp i { display: block; height: 100%; width: 0; background: linear-gradient(90deg, #f5c542, #fb923c); }
  .ups { display: grid; grid-template-columns: 1fr; gap: 8px; }
  .up { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; text-align: left; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .up b { font-weight: 600; font-size: 13px; }
  .up em { font-style: normal; color: var(--muted); font-size: 12px; }
  .up .nx { font-size: 12px; color: var(--fg); }
  .up small { color: var(--gold); font: 600 15px var(--display); }
  .pips { display: flex; gap: 4px; }
  .pips i { width: 10px; height: 10px; border-radius: 50%; background: rgba(255,255,255,.15); }
  .pips i.f { background: var(--gold); }
  .acts { display: flex; justify-content: flex-end; }

  .msg { margin: 0; min-height: 1.4em; color: var(--muted); font-size: 13px; }
  .msg.bad { color: var(--danger); }
  .msg.good { color: var(--ok); }

  .overlay { position: fixed; inset: 0; background: rgba(5,8,12,.86); display: flex; align-items: center; justify-content: center; padding: 12px; z-index: 20; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 18px; padding: 18px; width: min(580px,100%); display: flex; flex-direction: column; gap: 8px; max-height: 100%; overflow-y: auto; }
  .card h1 { margin: 0; font: 600 26px var(--display); }
  .card h2 { margin: 6px 0 0; font: 600 12px var(--text); text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .opts { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 8px; }
  .opt { background: var(--panel-2); border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; text-align: left; min-width: 0; }
  .opt.on { border-color: var(--gold); }
  .opt b { display: block; font-weight: 600; }
  .opt small { color: var(--muted); font-size: 12px; }
  .card .btn.main { padding: 12px; margin-top: 6px; }
  .card .btn { padding: 12px; }
</style>

<div id="rot">
<main class="app">
  <header class="hud">
    <div class="stat"><span>Vite</span><b id="lives">0</b></div>
    <div class="stat"><span>Soldi</span><b id="cash">0</b></div>
    <div class="stat"><span>Round</span><b id="round">0 / 40</b></div>
    <div class="ctrl">
      <button class="btn main" id="play" type="button">Via il round</button>
      <button class="btn" id="speed" type="button">×1</button>
      <button class="btn" id="pause" type="button">Pausa</button>
      <button class="btn" id="save" type="button">Salva</button>
      <button class="btn" id="auto" type="button">Auto: no</button>
      <button class="btn" id="menu" type="button">Menu</button>
    </div>
  </header>

  <div class="board"><canvas id="cv" width="960" height="600" aria-label="Campo di gioco"></canvas></div>

  <div class="side">
    <section class="shop" id="shop" aria-label="Scimmie ed eroi"></section>
    <section class="sel" id="sel" hidden>
      <div class="selhead"><canvas id="selIcon" width="56" height="56"></canvas>
        <div><h3 id="selName">Scimmia</h3><p id="selInfo"></p><p class="stline" id="selStats"></p></div></div>
      <div class="xp" id="xp" hidden><i id="xpf"></i></div>
      <div class="ups">
        <button class="up" id="upA" type="button"></button>
        <button class="up" id="upB" type="button"></button>
      </div>
      <div class="acts"><button class="btn" id="sellBtn" type="button">Vendi</button></div>
    </section>
    <p class="msg" id="msg" role="status"></p>
  </div>
</main>

<div class="overlay" id="start">
  <div class="card">
    <h1>Pop Tower Defense</h1>
    <h2>Mappa</h2>
    <div class="opts" id="maps"></div>
    <h2>Difficoltà</h2>
    <div class="opts" id="diffs"></div>
    <button class="btn" id="load" type="button" hidden>Carica partita salvata</button>
    <button class="btn main" id="go" type="button">Gioca</button>
  </div>
</div>

<div class="overlay" id="end" hidden>
  <div class="card">
    <h1 id="endTitle">Fine</h1>
    <p id="endText"></p>
    <button class="btn main" id="inf" type="button" hidden>Continua all’infinito</button>
    <button class="btn" id="again" type="button">Menu</button>
  </div>
</div>
</div>

  /* ---------- Palloni ---------- */
  function drawBalloon(b) {
    const def = BT[b.type];
    if (def.blimp || def.boss) { drawBigEnemy(b, def); return; }
    const big =b.type === 'black' || b.type === 'lead' || b.type === 'rainbow' ? 1.12 : 1;
    const rx = 15 * big, ry = 19 * big, bx = b.x, by = b.y;
    const wob = Math.sin(now() * 6 + b.s * .2) * 2;
    ctx.beginPath(); ctx.moveTo(bx, by + ry + 4); ctx.quadraticCurveTo(bx + wob, by + ry + 10, bx - wob * .4, by + ry + 18);
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 1.3; ctx.stroke();
    if (b.frozen > 0) { ctx.beginPath(); ctx.ellipse(bx, by, rx + 4, ry + 4, 0, 0, PI2); ctx.strokeStyle = 'rgba(186,230,253,.85)'; ctx.lineWidth = 3; ctx.stroke(); }
    ctx.beginPath(); ctx.ellipse(bx, by, rx, ry, 0, 0, PI2);
    if (def.stripes) {

      cols.forEach((col, i) => { ctx.fillStyle = col; ctx.fillRect(bx - rx, by - ry + i * (ry * 2 / 6), rx * 2, ry * 2 / 6 + 1); });
      ctx.restore();
    } else {

      g.addColorStop(0, def.pal[0]); g.addColorStop(.45, def.pal[1]); g.addColorStop(1, def.pal[2]);
      ctx.fillStyle = g; ctx.fill();
    }
    if (def.crack) {

      ctx.beginPath(); ctx.moveTo(bx - 4, by - 14); ctx.lineTo(bx + 1, by - 4); ctx.lineTo(bx - 3, by + 2); ctx.lineTo(bx + 4, by + 12);
      ctx.moveTo(bx + 1, by - 4); ctx.lineTo(bx + 8, by - 2);
      ctx.strokeStyle = 'rgba(100,116,139,.55)'; ctx.lineWidth = 1.2; ctx.stroke(); ctx.restore();
    }
    if (def.rivets) {
      ctx.fillStyle = 'rgba(15,23,42,.6)';
      for (let i = 0; i < 6; i++) { const a = i * 1.047 + .5; ctx.beginPath(); ctx.arc(bx + Math.cos(a) * rx * .6, by + Math.sin(a) * ry * .55, 1.4, 0, PI2); ctx.fill(); }
    }
    if (b.flash > 0) { ctx.beginPath(); ctx.ellipse(bx, by, rx, ry, 0, 0, PI2); ctx.fillStyle = `rgba(255,255,255,${(b.flash * .8).toFixed(2)})`; ctx.fill(); }
    ctx.beginPath(); ctx.ellipse(bx, by, rx, ry, 0, 0, PI2);

    ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fill();
    ctx.beginPath(); ctx.moveTo(bx - 3, by + ry - 1); ctx.lineTo(bx + 3, by + ry - 1); ctx.lineTo(bx, by + ry + 4); ctx.closePath();
    ctx.fillStyle = def.pal[2]; ctx.fill();

      ctx.fillStyle = f > .5 ? '#22c55e' : '#f05252'; ctx.fillRect(bx - w / 2, by - ry - 10, w * f, 4);

  }
  // Dirigibile e boss, disegnati con le forme proprie di ciascuno.
  function drawBigEnemy(b, def) {
    const x = b.x, y = b.y;
    const grd = ctx.createRadialGradient(x - 8, y - 10, 3, x, y, 36);
    grd.addColorStop(0, def.pal[0]); grd.addColorStop(.5, def.pal[1]); grd.addColorStop(1, def.pal[2]);
    if (def.blimp) {
      ctx.beginPath(); ctx.moveTo(x - 26, y - 2); ctx.lineTo(x - 42, y - 13); ctx.lineTo(x - 42, y + 13); ctx.lineTo(x - 26, y + 2); ctx.closePath();
      ctx.fillStyle = def.pal[2]; ctx.fill();
      ctx.beginPath(); ctx.ellipse(x, y, 32, 14, 0, 0, PI2); ctx.fillStyle = grd; ctx.fill();
      ctx.strokeStyle = def.pal[2]; ctx.lineWidth = 1.5; ctx.stroke();
      ctx.fillStyle = 'rgba(255,255,255,.35)'; ctx.fillRect(x - 22, y - 8, 44, 3);
      ctx.fillStyle = '#334155'; ctx.fillRect(x - 9, y + 12, 18, 8);
      ctx.fillStyle = '#fbbf24'; ctx.fillRect(x - 6, y + 14, 3, 3); ctx.fillRect(x + 2, y + 14, 3, 3);

      ctx.fillStyle = def.pal[2];

        ctx.lineTo(x + Math.cos(a) * 37, y + Math.sin(a) * 37);

        ctx.beginPath(); ctx.arc(x + sx * 10 + sx, y - 3, 3, 0, PI2); ctx.fillStyle = '#111'; ctx.fill();
        ctx.beginPath(); ctx.moveTo(x + sx * 18, y - 15); ctx.lineTo(x + sx * 5, y - 10); ctx.strokeStyle = '#111'; ctx.lineWidth = 2.5; ctx.stroke();

      ctx.beginPath(); ctx.moveTo(x - 11, y - 24); ctx.lineTo(x - 11, y - 34); ctx.lineTo(x - 5, y - 28); ctx.lineTo(x, y - 36); ctx.lineTo(x + 5, y - 28); ctx.lineTo(x + 11, y - 34); ctx.lineTo(x + 11, y - 24); ctx.closePath(); ctx.fill();
    }
    if (b.flash > 0) { ctx.beginPath(); ctx.ellipse(x, y, 32, 32, 0, 0, PI2); ctx.fillStyle = `rgba(255,255,255,${(b.flash * .7).toFixed(2)})`; ctx.fill(); }
    if (b.frozen > 0) { ctx.beginPath(); ctx.arc(x, y, 36, 0, PI2); ctx.strokeStyle = 'rgba(186,230,253,.85)'; ctx.lineWidth = 3; ctx.stroke(); }

    ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(x - w / 2, top, w, 5);

  const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

  /* ---------- Round ---------- */
  function buildRound(r) {
    const list = [];
    const n = Math.min(160, Math.round((8 + r * 2) * S.diff.count * (S.map.cm || 1)));
    const pool = ROUND_POOL.filter(([from]) => r >= from).map(([, k]) => k);
    let t = 0;
    for (let i = 0; i < n; i++) {
      const bias = Math.random() * Math.random();
      list.push({ t, type: pool[Math.min(pool.length - 1, Math.floor(bias * pool.length))] });
      t += Math.max(.35, 1.2 - r * .03);
    }
    if (r % 5 === 0) list.push({ t: t * .5, type: 'blimp' });
    if (r % 10 === 0) list.push({ t: t + 1, type: BOSSES[((r / 10) - 1) % BOSSES.length] });
    list.sort((a, b) => a.t - b.t);
    return list;
  }
  function startRound() {
    if (!S.playing || S.active || S.over) return;
    S.round++;
    S.spawns = buildRound(S.round);
    S.clock = 0; S.active = true;
    say('Round ' + S.round + ' in arrivo.');
  }
  function say(text, cls = '') { const m = $('msg'); m.textContent = text; m.className = 'msg ' + cls; }

  /* ---------- Attacchi ---------- */
  function fire(t, target) {
    const d = DEF(t), st = stats(t), mode = d.mode;
    const aimA = target ? Math.atan2(target.y - t.y, target.x - t.x) : 0;
    if (mode === 'farm') {
      S.cash += st.cash;
      S.fx.push({ kind: 'txt', text: '+' + st.cash, x: t.x, y: t.y - 34, t: 0, life: .9, col: '#facc15' });
      return;
    }
    if (mode === 'ice') {
      for (const b of S.balloons) {
        if (b.s < 0 || Math.hypot(b.x - t.x, b.y - t.y) > st.range) continue;
        b.frozen = Math.max(b.frozen, st.freeze);
        if (st.dmg > 0) b.hp -= st.dmg;
      }
      S.fx.push({ kind: 'ring', col: '#7dd3fc', x: t.x, y: t.y, t: 0, life: .5, max: st.range });
      return;
    }
    if (mode === 'chain') {
      const hits = [target];
      let last = target;
      for (let c = 0; c < st.chain; c++) {
        let nx = null, best = 1e9;
        for (const b of S.balloons) {
          if (b.s < 0 || hits.includes(b)) continue;
          const dd = Math.hypot(b.x - last.x, b.y - last.y);
          if (dd < 110 && dd < best) { best = dd; nx = b; }
        }
        if (!nx) break;
        hits.push(nx); last = nx;
      }
      let prev = { x: t.x, y: t.y };
      for (const b of hits) {
        b.hp -= st.dmg; b.flash = 1;
        S.fx.push({ kind: 'bolt', x: prev.x, y: prev.y, x2: b.x, y2: b.y, t: 0, life: .18, col: '#c4b5fd' });
        prev = b;
      }
      return;
    }
    if (mode === 'spray') {
      for (let i = 0; i < st.count; i++) {
        const a = i * PI2 / st.count;
        const sp = 520;
        S.projs.push({ kind: 'pellet', x: t.x, y: t.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, sp, life: st.range / sp, dmg: st.dmg, pierce: st.pierce, hit: new Set(), col: d.col, sharp: true });
      }
      return;
    }
    if (mode === 'fan') {
      const n = st.count, spread = .24;
      for (let i = 0; i < n; i++) {
        const a = aimA + (i - (n - 1) / 2) * spread, sp = 480;
        S.projs.push({ kind: 'pellet', x: t.x, y: t.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, sp, life: st.range / sp, dmg: st.dmg, pierce: st.pierce, hit: new Set(), col: d.col, sharp: true });
      }
      return;
    }
    if (mode === 'bomb') {
      for (let i = 0; i < st.count; i++) {
        const spread = st.count > 1 ? 70 : 0;
        const tx = target.x + (Math.random() - .5) * spread, ty = target.y + (Math.random() - .5) * spread;
        const dx = tx - t.x, dy = ty - t.y, dist = Math.hypot(dx, dy) || 1, sp = 320;
        S.projs.push({ kind: 'bomb', x: t.x, y: t.y, vx: dx / dist * sp, vy: dy / dist * sp, sp, life: dist / sp, dmg: st.dmg, aoe: st.aoe, hit: new Set(), col: '#111827' });
      }
      return;
    }
    if (mode === 'missile') {
      for (let i = 0; i < st.count; i++) {
        const a = aimA + (i - (st.count - 1) / 2) * .22, sp = 380;
        S.projs.push({ kind: 'missile', x: t.x, y: t.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, sp, life: 2.4, dmg: st.dmg, aoe: st.aoe, pierce: 1, hit: new Set(), col: '#e2e8f0', homing: true, tgt: target, sharp: false });
      }
      return;
    }
    // dardi, cecchino, ninja, laser, colla, super e torretta
    const sp = SHOT_SPEED[d.shot] || 560;
    S.projs.push({ kind: 'dart', x: t.x, y: t.y, vx: Math.cos(aimA) * sp, vy: Math.sin(aimA) * sp, sp, life: 1.3, dmg: st.dmg, pierce: st.pierce, glue: st.glue, hit: new Set(), col: SHOT_COL[d.shot] || '#fde68a', homing: !!d.homing, tgt: target, sharp: !!d.sharp });
  }

  function explode(x, y, r, dmg) {
    for (const b of S.balloons) if (b.s >= 0 && Math.hypot(b.x - x, b.y - y) <= r + 17) { b.hp -= dmg; b.flash = 1; }
    S.fx.push({ kind: 'boom', x, y, t: 0, life: .45, max: r, col: '#fb923c' });
  }

  /* ---------- Aggiornamento ---------- */
  function update(dt) {
    if (S.autoT > 0 && !S.paused) {
      S.autoT -= dt;
      if (S.autoT <= 0) { S.autoT = 0; startRound(); }
    }
    if (S.active && !S.paused) {
      S.clock += dt;
      while (S.spawns.length && S.spawns[0].t <= S.clock) {
        const sp = S.spawns.shift();
        const hp = Math.ceil(BT[sp.type].hp * S.diff.hp) + Math.floor(S.round / 12);
        S.balloons.push({ type: sp.type, hp, maxhp: hp, s: -20, x: 0, y: 0, frozen: 0, slowT: 0, slowF: 1, flash: 0 });
      }
    }
    if (S.paused) return;

    for (const b of S.balloons) {
      b.frozen -= dt; b.slowT -= dt;
      if (b.slowT <= 0) { b.slowT = 0; b.slowF = 1; }
      b.flash = Math.max(0, b.flash - dt * 4);
      const sf = b.frozen > 0 ? .45 : b.slowF;
      b.s += BT[b.type].sp * S.diff.speed * (S.map.sm || 1) * sf * dt;
      const p = posAt(Math.max(0, b.s));
      b.x = p.x; b.y = p.y;
    }

    // effetti delle torri eroe: Liana accelera, Banano rallenta
    for (const t of S.towers) t.buff = 1;
    for (const h of S.towers) {
      if (!h.isHero || !HR[h.k].aura) continue;
      const au = HR[h.k].aura;
      for (const t of S.towers) if (au.buff && Math.hypot(t.x - h.x, t.y - h.y) <= au.r) t.buff = Math.max(t.buff, au.buff);
      if (au.slow) for (const b of S.balloons) if (b.s >= 0 && Math.hypot(b.x - h.x, b.y - h.y) <= au.r) { b.slowT = Math.max(b.slowT, .2); b.slowF = Math.min(b.slowF, au.slow); }
    }

    for (const t of S.towers) {
      t.recoil = Math.max(0, (t.recoil || 0) - dt);
      t.cool -= dt * t.buff;
      if (t.cool > 0) continue;
      const d = DEF(t), st = stats(t);
      let target = null;
      if (d.mode !== 'ice' && d.mode !== 'farm') {
        for (const b of S.balloons) {
          if (b.s < 0) continue;
          if (Math.hypot(b.x - t.x, b.y - t.y) <= st.range + 17 && (!target || b.s > target.s)) target = b;
        }
        if (!target) continue;
      }
      fire(t, target);
      t.cool = st.cd;
      t.recoil = .12;
    }

    for (const p of S.projs) {
      if (p.homing && p.tgt && p.tgt.hp > 0 && !p.tgt.gone && p.tgt.s >= 0) {
        const dx = p.tgt.x - p.x, dy = p.tgt.y - p.y, L = Math.hypot(dx, dy) || 1;
        const k = Math.min(1, dt * 6);
        p.vx += (dx / L * p.sp - p.vx) * k;
        p.vy += (dy / L * p.sp - p.vy) * k;
      }
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.kind === 'bomb') {
        if (p.life <= 0) { explode(p.x, p.y, p.aoe, p.dmg); p.dead = true; }
        continue;
      }
      for (const b of S.balloons) {
        if (p.dead || p.hit.has(b) || b.s < 0 || b.hp <= 0) continue;
        if (p.sharp && BT[b.type].sharpImmune) continue;
        if (Math.hypot(b.x - p.x, b.y - p.y) < 20 + (BT[b.type].rad || 0)) {
          p.hit.add(b);
          if (p.glue) { b.slowT = Math.max(b.slowT, p.glue); b.slowF = .5; }
          if (p.kind === 'missile') { explode(p.x, p.y, p.aoe, p.dmg); p.dead = true; break; }
          b.hp -= p.dmg; b.flash = 1;
          p.pierce--;
          if (p.pierce <= 0) { p.dead = true; break; }
        }
      }
      if (p.life <= 0) p.dead = true;
    }
    S.projs = S.projs.filter((p) => !p.dead);

    for (const b of S.balloons) {
      if (b.hp <= 0 && !b.gone) {
        b.gone = true;
        const lv = BT[b.type].lives;
        S.cash += Math.round(lv * S.diff.cashMul);
        for (let i = 0; i < 8; i++) {
          const a = i / 8 * PI2;
          S.fx.push({ kind: 'spark', x: b.x, y: b.y, vx: Math.cos(a) * 120, vy: Math.sin(a) * 120, t: 0, life: .4, col: BT[b.type].c });
        }
        for (const h of S.towers) if (h.isHero) {
          h.xp += lv;
          while (h.lvl < HERO_MAX && h.xp >= h.lvl * XP_STEP) {
            h.lvl++;
            S.fx.push({ kind: 'txt', text: 'Livello ' + h.lvl, x: h.x, y: h.y - 44, t: 0, life: 1.1, col: '#fbbf24' });
          }
        }
      }
    }
    S.balloons = S.balloons.filter((b) => {
      if (b.gone) return false;
      if (b.s >= S.TOTAL) {
        S.lives -= BT[b.type].lives;
        const end = S.PTS[S.PTS.length - 1];
        S.fx.push({ kind: 'ring', x: end.x, y: end.y, t: 0, life: .5, max: 40, col: '#f05252' });
        if (S.lives <= 0 && !S.over) endGame(false);
        return false;
      }
      return true;
    });

    if (S.active && S.spawns.length === 0 && S.balloons.length === 0 && !S.over) {
      S.active = false;
      const bonus = Math.round((100 + S.round * 10) * S.diff.cashMul);
      S.cash += bonus;
      if (!S.infinite && S.round >= 40) {
        endGame(true);
      } else {
        say('Round ' + S.round + ' completato: +' + bonus + ' soldi.', 'good');
        saveGame(true);
        if (S.auto) S.autoT = 2.5;
      }
    }

    for (const f of S.fx) {
      f.t += dt;
      if (f.vx !== undefined) { f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= .9; f.vy *= .9; }
      if (f.kind === 'txt') f.y -= 28 * dt;
      f.r = (f.t / f.life) * (f.max || 0);
    }
    S.fx = S.fx.filter((f) => f.t < f.life);
  }

  /* ---------- Salvataggio ---------- */
  const SAVE_KEY = 'pop-td-save-v2';
  function readSave() {
    try {
      const d = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null');
      return d && typeof d.round === 'number' && Array.isArray(d.towers) && MAPS[d.mapIdx] && DIFFS[d.diffIdx] ? d : null;
    } catch (e) { return null; }
  }
  function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* ignorato */ } refreshLoad(); }
  function refreshLoad() { $('load').hidden = !readSave(); }
  function saveGame(silent) {
    if (!S.playing || S.active || S.over) { if (!silent) say('Puoi salvare solo tra un round e l’altro.', 'bad'); return; }
    const data = {
      mapIdx: S.mapIdx, diffIdx: S.diffIdx, cash: S.cash, lives: S.lives, round: S.round, infinite: S.infinite,
      towers: S.towers.map((t) => ({ k: t.k, isHero: !!t.isHero, x: t.x, y: t.y, a: t.a, b: t.b, lvl: t.lvl || 0, xp: t.xp || 0, spent: t.spent })),
    };
    try {
      localStorage.setItem(SAVE_KEY, JSON.stringify(data));
      if (!silent) say('Partita salvata.', 'good');
    } catch (e) {
      if (!silent) say('Salvataggio non disponibile in questo browser.', 'bad');
    }
    refreshLoad();
  }
  function loadGame() {
    const data = readSave();
    if (!data) { say('Nessun salvataggio trovato.', 'bad'); return; }
    S.mapIdx = data.mapIdx; S.diffIdx = data.diffIdx;
    newGame();
    S.cash = data.cash; S.lives = data.lives; S.round = data.round; S.infinite = !!data.infinite;
    S.towers = data.towers.filter((t) => (t.isHero ? HR[t.k] : TD[t.k])).map((t) => (t.isHero
      ? { k: t.k, isHero: true, lvl: Math.max(1, t.lvl), xp: t.xp, x: t.x, y: t.y, a: 0, b: 0, cool: 0, spent: t.spent, recoil: 0, buff: 1 }
      : { k: t.k, x: t.x, y: t.y, a: t.a, b: t.b, cool: 0, spent: t.spent, recoil: 0, buff: 1 }));
    say('Partita caricata: si riparte dal round ' + (S.round + 1) + '.', 'good');
  }

  /* ---------- Fine partita ---------- */
  function endGame(won) {
    S.over = true; S.won = won; S.active = false; S.autoT = 0;
    if (won) {
      $('endTitle').textContent = 'Vittoria!';
      $('endText').textContent = 'Hai superato i 40 round su ' + S.map.name + ' (' + S.diff.name + '). Vuoi continuare all’infinito? In quel caso la partita resta salvata anche se chiudi.';
      $('inf').hidden = false;
      $('again').textContent = 'Chiudi';
    } else {
      $('endTitle').textContent = 'Sconfitta';
      $('endText').textContent = 'Sei arrivato al round ' + S.round + ' su ' + S.map.name + ' (' + S.diff.name + (S.infinite ? ', infinito' : '') + ').';
      $('inf').hidden = true;
      $('again').textContent = 'Nuova partita';
      clearSave();
    }
    $('end').hidden = false;
  }

  /* ---------- Disegno ---------- */
  const AMB = {
    prato: { col: 'rgba(255,255,255,.35)', vx: 8, vy: -2, r: 1.5, n: 14 },
    deserto: { col: 'rgba(255,230,170,.35)', vx: 40, vy: 6, r: 1.2, n: 20 },
    vulcano: { col: '#fb923c', vx: 4, vy: -30, r: 1.8, n: 22 },
    neve: { col: '#ffffff', vx: -10, vy: 28, r: 2, n: 40 },
    giungla: { col: 'rgba(190,255,150,.45)', vx: 6, vy: 4, r: 1.6, n: 14 },
    citta: { col: 'rgba(250,240,170,.5)', vx: 2, vy: -3, r: 1.4, n: 18 },
    tempesta: { col: 'rgba(186,230,253,.55)', vx: -30, vy: 220, r: 1, n: 50 },
  };
  const AMB_SEEDS = Array.from({ length: 60 }, (_, i) => [rng(i + 7)(), rng(i + 99)()]);
  const mod = (v, m) => ((v % m) + m) % m;

  function draw(t) {
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.drawImage(S.bg, 0, 0);
    const cfg = AMB[S.amb];
    if (cfg) {
      ctx.fillStyle = cfg.col;
      for (let i = 0; i < cfg.n; i++) {
        const [a, b] = AMB_SEEDS[i];
        const x = mod(a * W + t * cfg.vx, W), y = mod(b * H + t * cfg.vy, H);
        ctx.beginPath(); ctx.arc(x, y, cfg.r, 0, PI2); ctx.fill();
      }
    }

    const showRange = (x, y, range, col) => {
      if (range <= 0) return;
      ctx.beginPath(); ctx.arc(x, y, range, 0, PI2);
      ctx.fillStyle = 'rgba(255,255,255,.07)'; ctx.fill();
      ctx.strokeStyle = col; ctx.setLineDash([6, 6]); ctx.lineWidth = 2; ctx.stroke(); ctx.setLineDash([]);
    };
    // raggio degli eroi che potenziano o rallentano le torri vicine
    for (const h of S.towers) {
      if (!h.isHero || !HR[h.k].aura) continue;
      ctx.beginPath(); ctx.arc(h.x, h.y, HR[h.k].aura.r, 0, PI2);
      ctx.fillStyle = 'rgba(245,197,66,.06)'; ctx.fill();
    }
    if (S.place && S.hover) {
      const col = Math.floor(S.hover.x / T), row = Math.floor(S.hover.y / T);
      const cx = col * T + T / 2, cy = row * T + T / 2;
      const d = defOf(S.place);
      const ok = canBuild(cx, cy) && S.cash >= d.cost;
      showRange(cx, cy, stats({ k: S.place, isHero: !!HR[S.place], a: 0, b: 0, lvl: 1 }).range, ok ? '#fff' : '#f05252');
      ctx.fillStyle = ok ? 'rgba(255,255,255,.14)' : 'rgba(240,82,82,.22)';
      ctx.fillRect(col * T, row * T, T, T);
      const label = 'Costo ' + d.cost;
      ctx.font = '700 18px Fredoka, system-ui, sans-serif';
      const lw = ctx.measureText(label).width + 16;
      ctx.fillStyle = 'rgba(0,0,0,.7)'; ctx.fillRect(cx - lw / 2, cy - 52, lw, 26);
      ctx.fillStyle = ok ? '#f5c542' : '#f05252'; ctx.textAlign = 'center';
      ctx.fillText(label, cx, cy - 33);
      ctx.textAlign = 'start';
    }
    if (S.sel) showRange(S.sel.x, S.sel.y, stats(S.sel).range, '#f5c542');

    for (const t2 of S.towers) {
      const rk = t2.recoil ? 1 - t2.recoil * .5 : 1;
      ctx.beginPath(); ctx.ellipse(t2.x, t2.y + 22, 24, 9, 0, 0, PI2); ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fill();
      drawMonkey(ctx, t2.x, t2.y - 2, t2.k, rk * (t2.isHero ? 1.12 : 1), !!t2.isHero);
      if (t2.isHero) {
        ctx.fillStyle = '#fbbf24'; ctx.font = '700 12px Fredoka, system-ui, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText('Liv ' + t2.lvl, t2.x, t2.y + 40); ctx.textAlign = 'start';
      } else {
        const tot = t2.a + t2.b;
        for (let i = 0; i < Math.min(tot, 10); i++) {
          ctx.beginPath(); ctx.arc(t2.x - 22 + i * 5 + 2, t2.y + 36, 2.2, 0, PI2); ctx.fillStyle = '#f5c542'; ctx.fill();
        }
      }
      if (S.sel === t2) { ctx.beginPath(); ctx.arc(t2.x, t2.y, 32, 0, PI2); ctx.strokeStyle = '#f5c542'; ctx.lineWidth = 3; ctx.stroke(); }
    }

    for (const b of S.balloons) if (b.s >= 0) drawBalloon(b);

    for (const p of S.projs) {
      const ang = Math.atan2(p.vy, p.vx);
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(ang);
      if (p.kind === 'bomb') {
        ctx.beginPath(); ctx.arc(0, 0, 8, 0, PI2); ctx.fillStyle = '#111827'; ctx.fill();
        ctx.strokeStyle = '#f97316'; ctx.lineWidth = 2; ctx.stroke();
        blob2(ctx, 6, -6, 2.4, '#fde047');
      } else if (p.kind === 'pellet') {
        ctx.beginPath(); ctx.arc(0, 0, 4.5, 0, PI2); ctx.fillStyle = p.col; ctx.fill();
      } else if (p.kind === 'missile') {
        ctx.fillStyle = '#e2e8f0'; ctx.fillRect(-9, -2.5, 18, 5);
        ctx.beginPath(); ctx.moveTo(-9, -3); ctx.lineTo(-15, 0); ctx.lineTo(-9, 3); ctx.fillStyle = '#fb923c'; ctx.fill();
      } else if (p.glue) {
        blob2(ctx, 0, 0, 5, 'rgba(20,184,166,.9)');
      } else {
        ctx.strokeStyle = p.col; ctx.lineWidth = 2.5;
        ctx.beginPath(); ctx.moveTo(-9, 0); ctx.lineTo(5, 0); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(8, 0); ctx.lineTo(3, -3); ctx.lineTo(3, 3); ctx.closePath(); ctx.fillStyle = p.col; ctx.fill();
      }
      ctx.restore();
    }

    for (const f of S.fx) {
      const k = f.t / f.life;
      ctx.globalAlpha = Math.max(0, 1 - k);
      if (f.kind === 'bolt') {
        ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x2, f.y2);
        ctx.strokeStyle = f.col; ctx.lineWidth = 4; ctx.stroke();
      } else if (f.kind === 'txt') {
        ctx.fillStyle = f.col; ctx.font = '700 18px Fredoka, system-ui, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(f.text, f.x, f.y); ctx.textAlign = 'start';
      } else if (f.kind === 'spark') {
        blob2(ctx, f.x, f.y, 3 * (1 - k) + .8, f.col);
      } else {
        ctx.beginPath(); ctx.arc(f.x, f.y, Math.max(1, f.r), 0, PI2);
        if (f.kind === 'boom') { ctx.fillStyle = f.col; ctx.fill(); }
        else { ctx.strokeStyle = f.col; ctx.lineWidth = 3; ctx.stroke(); }
      }
      ctx.globalAlpha = 1;
    }

    if (S.paused && S.playing) {
      ctx.fillStyle = 'rgba(0,0,0,.45)'; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = '#e9eef5'; ctx.font = '600 48px Fredoka, system-ui, sans-serif';
      ctx.textAlign = 'center'; ctx.fillText('In pausa', W / 2, H / 2 + 16); ctx.textAlign = 'start';
    }
  }

  /* ---------- Negozio ---------- */
  function shopBtn(k, hero) {
    const d = defOf(k);
    const b = document.createElement('button');
    b.className = 'tw' + (hero ? ' hero' : ''); b.type = 'button'; b.dataset.k = k;
    const ic = document.createElement('canvas'); ic.width = 92; ic.height = 92;
    drawMonkey(ic.getContext('2d'), 46, 46, k, 1.55, hero);
    const txt = document.createElement('div'); txt.className = 'txt';
    txt.innerHTML = '<span>' + d.name + '</span><em>Costo</em><small>' + d.cost + '</small>';
    b.appendChild(ic); b.appendChild(txt);
    b.addEventListener('click', () => {
      if (!S.playing || S.over) return;
      if (S.place === k) { S.place = null; say('Piazzamento annullato.'); renderHud(); return; }
      S.place = k; S.sel = null; renderSel();
      say('Tocca il prato per piazzare ' + d.name + ' (costo ' + d.cost + ').');
    });
    return b;
  }
  function buildShop() {
    const shop = $('shop');
    const head = (text) => { const h = document.createElement('h4'); h.className = 'shh'; h.textContent = text; shop.appendChild(h); };
    head('Scimmie');
    for (const k of ORDER) shop.appendChild(shopBtn(k, false));
    head('Eroi (uno per tipo)');
    for (const k of HERO_ORDER) shop.appendChild(shopBtn(k, true));
  }

  function renderHud() {
    $('lives').textContent = S.lives;
    $('cash').textContent = S.cash;
    $('round').textContent = S.round + ' / ' + (S.infinite ? '∞' : '40');
    $('speed').textContent = '×' + S.speed;
    $('pause').textContent = S.paused ? 'Riprendi' : 'Pausa';
    $('pause').classList.toggle('on', S.paused);
    $('save').disabled = S.active || S.over || !S.playing;
    $('auto').textContent = 'Auto: ' + (S.auto ? 'sì' : 'no');
    $('auto').classList.toggle('on', S.auto);
    $('play').disabled = S.active || S.over || !S.playing;
    $('play').textContent = S.active ? 'In corso…' : (S.round === 0 ? 'Via il round' : 'Prossimo round');
    document.querySelectorAll('.tw').forEach((b) => {
      const k = b.dataset.k, d = defOf(k);
      const placed = !!HR[k] && S.towers.some((t) => t.isHero && t.k === k);
      b.disabled = S.cash < d.cost || S.over || !S.playing || placed;
      b.classList.toggle('on', S.place === k);
    });
  }

  /* ---------- Pannello scelta ---------- */
  let selSig = '';
  function renderSel() {
    const box = $('sel');
    if (!S.sel) { box.hidden = true; selSig = ''; return; }
    const t = S.sel, d = DEF(t), st = stats(t);
    const pathA = t.isHero ? null : d.up[0], pathB = t.isHero ? null : d.up[1];
    const sig = [t.k, t.x, t.y, t.a, t.b, t.lvl, t.xp, S.cash, S.over, S.sel === t].join('|');
    if (sig === selSig) return;
    selSig = sig;
    box.hidden = false;
    if (!box.dataset.icon || box.dataset.icon !== t.k + (t.lvl || 0)) {
      box.dataset.icon = t.k + (t.lvl || 0);
      const si = $('selIcon').getContext('2d');
      si.clearRect(0, 0, 56, 56); drawMonkey(si, 28, 30, t.k, .85, !!t.isHero);
    }
    $('selName').textContent = d.name + (t.isHero ? ' · Liv. ' + t.lvl : '');
    $('selInfo').textContent = t.isHero ? (d.desc + ' ' + growText(d)) : d.desc;
    if (t.isHero) {
      $('selStats').textContent = 'Danno ' + st.dmg + ', raggio ' + Math.round(st.range) + ', ricarica ' + st.cd.toFixed(2) + ' s';
      const lo = (t.lvl - 1) * XP_STEP, hi = t.lvl * XP_STEP;
      $('xp').hidden = false;
      $('xpf').style.width = t.lvl >= HERO_MAX ? '100%' : clamp((t.xp - lo) / (hi - lo) * 100, 0, 100) + '%';
    } else {
      const parts = [];
      if (st.cash) parts.push('Soldi ' + st.cash + ' ogni ' + st.cd.toFixed(1) + ' s');
      else parts.push('Danno ' + st.dmg + ', raggio ' + Math.round(st.range) + ', ricarica ' + st.cd.toFixed(2) + ' s');
      $('selStats').textContent = parts.join(' · ');
      $('xp').hidden = true;
    }
    $('upA').hidden = t.isHero; $('upB').hidden = t.isHero;
    $('sellBtn').hidden = t.isHero;
    if (!t.isHero) {
      [0, 1].forEach((p) => {
        const btn = $(p === 0 ? 'upA' : 'upB');
        const path = p === 0 ? pathA : pathB;
        const tier = p === 0 ? t.a : t.b;
        const ok = canUp(t, p);
        const cost = ok ? tierCost(t.k, tier) : null;
        let pips = '';
        for (let i = 0; i < MAXT; i++) pips += '<i class="' + (i < tier ? 'f' : '') + '"></i>';
        const cur = tier > 0 ? 'Attuale: ' + describe(path.e[tier - 1]) : 'Nessun potenziamento';
        let nx;
        if (tier >= MAXT) nx = 'Livello massimo raggiunto';
        else if (!ok) nx = 'Bloccato: serve meno di 3 nell’altro percorso';
        else nx = 'Prossimo (Liv. ' + (tier + 1) + '): ' + describe(path.e[tier]);
        btn.innerHTML = '<b>' + path.name + ' · ' + tier + '/' + MAXT + '</b>' +
          '<span class="pips">' + pips + '</span><em>' + cur + '</em><span class="nx">' + nx + '</span>' +
          (cost !== null ? '<small>Costo ' + cost + '</small>' : '');
        btn.disabled = cost === null || S.cash < cost || S.over;
      });
      $('sellBtn').textContent = 'Vendi · +' + Math.round(t.spent * .7);
    }
  }

  /* ---------- Input ---------- */
  // Converte il tocco in coordinate della mappa, anche con la pagina ruotata di 90 gradi.
  function toCanvas(e) {
    const r = cv.getBoundingClientRect();
    if (window.matchMedia('(orientation: portrait)').matches) {
      return { x: (e.clientY - r.top) / r.height * W, y: (r.right - e.clientX) / r.width * H };
    }
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  }
  cv.addEventListener('pointermove', (e) => { if (S.place) S.hover = toCanvas(e); });
  cv.addEventListener('pointerleave', () => { S.hover = null; });
  cv.addEventListener('pointerdown', (e) => {
    if (!S.playing || S.over) return;
    const p = toCanvas(e);
    const hit = S.towers.find((t) => Math.hypot(t.x - p.x, t.y - p.y) < 30);
    if (S.place) {
      if (hit) { S.sel = hit; S.place = null; renderSel(); return; }
      const k = S.place, hero = !!HR[k], d = defOf(k);
      if (hero && S.towers.some((t) => t.isHero && t.k === k)) { say('Questo eroe è già in campo.', 'bad'); return; }
      const col = Math.floor(p.x / T), row = Math.floor(p.y / T);
      const cx = col * T + T / 2, cy = row * T + T / 2;
      if (!canBuild(cx, cy)) { say('Serve una casella libera, lontano dal sentiero.', 'bad'); return; }
      if (S.cash < d.cost) { say('Soldi insufficienti per ' + d.name + '.', 'bad'); return; }
      const t = { k, isHero: hero, lvl: 1, xp: 0, x: cx, y: cy, a: 0, b: 0, cool: 0, spent: d.cost, recoil: 0, buff: 1 };
      S.towers.push(t);
      S.cash -= d.cost;
      S.place = null; S.hover = null; S.sel = t;
      say(d.name + ' piazzata.', 'good');
      renderSel();
      return;
    }
    S.sel = hit || null;
    renderSel();
  });

  [0, 1].forEach((p) => $(p === 0 ? 'upA' : 'upB').addEventListener('click', () => {
    const t = S.sel; if (!t || t.isHero || !canUp(t, p)) return;
    const c = tierCost(t.k, p === 0 ? t.a : t.b);
    if (S.cash < c) { say('Soldi insufficienti.', 'bad'); return; }
    S.cash -= c; t.spent += c;
    if (p === 0) t.a++; else t.b++;
    say(TD[t.k].name + ': ' + TD[t.k].up[p].name + ' livello ' + (p === 0 ? t.a : t.b) + '.', 'good');
    selSig = ''; renderSel();
  }));
  $('sellBtn').addEventListener('click', () => {
    const t = S.sel; if (!t || t.isHero) return;
    S.cash += Math.round(t.spent * .7);
    S.towers = S.towers.filter((x) => x !== t);
    S.sel = null; selSig = ''; renderSel(); say('Scimmia venduta.');
  });

  $('play').addEventListener('click', startRound);
  $('speed').addEventListener('click', () => { S.speed = S.speed === 1 ? 2 : S.speed === 2 ? 3 : 1; });
  $('pause').addEventListener('click', () => { S.paused = !S.paused; });
  $('save').addEventListener('click', () => saveGame(false));
  $('auto').addEventListener('click', () => {
    S.auto = !S.auto;
    if (!S.auto) S.autoT = 0;
    say(S.auto ? 'Round automatici attivi: il prossimo parte da solo.' : 'Round automatici disattivati.');
    if (S.auto && !S.active && S.playing && !S.over) startRound();
  });
  $('menu').addEventListener('click', () => { S.paused = true; refreshLoad(); $('start').hidden = false; });
  $('load').addEventListener('click', loadGame);
  $('inf').addEventListener('click', () => {
    S.infinite = true; S.over = false; S.won = false;
    $('end').hidden = true;
    say('Modalità infinita: i round continuano senza fine.', 'good');
    saveGame(true);
  });
  $('again').addEventListener('click', () => {
    $('end').hidden = true;
    if (S.won && !S.infinite) clearSave();
    refreshLoad();
    $('start').hidden = false;
  });

  /* ---------- Menu iniziale ---------- */
  function buildMenu() {
    MAPS.forEach((m, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'opt'; b.dataset.i = i;
      b.innerHTML = '<b>' + m.name + '</b><small>' + m.desc + '</small>';
      b.addEventListener('click', () => { S.mapIdx = i; markMenu(); });
      $('maps').appendChild(b);
    });
    DIFFS.forEach((d, i) => {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'opt'; b.dataset.i = i;
      b.innerHTML = '<b>' + d.name + '</b><small>' + d.desc + ' Vite ' + d.lives + '.</small>';
      b.addEventListener('click', () => { S.diffIdx = i; markMenu(); });
      $('diffs').appendChild(b);
    });
    markMenu();
  }
  function markMenu() {
    document.querySelectorAll('#maps .opt').forEach((b) => b.classList.toggle('on', +b.dataset.i === S.mapIdx));
    document.querySelectorAll('#diffs .opt').forEach((b) => b.classList.toggle('on', +b.dataset.i === S.diffIdx));
  }

  function newGame() {
    S.mapIdx = S.mapIdx || 0;
    S.map = MAPS[S.mapIdx];
    S.diff = DIFFS[S.diffIdx];
    setMap(S.map);
    S.cash = S.diff.cash; S.lives = S.diff.lives; S.round = 0; S.infinite = false;
    S.active = false; S.clock = 0; S.spawns = [];
    S.balloons = []; S.towers = []; S.projs = []; S.fx = [];
    S.speed = 1; S.paused = false; S.place = null; S.sel = null; S.hover = null;
    S.over = false; S.won = false; S.playing = true; S.auto = false; S.autoT = 0;
    $('start').hidden = true; $('end').hidden = true;
    selSig = ''; renderSel();
    say('Scegli una scimmia o un eroe, poi tocca il prato per piazzarlo.');
  }
  $('go').addEventListener('click', newGame);

  /* ---------- Adattamento e ciclo ---------- */
  let fitW = 0, fitH = 0;
  function fit() {
    const bd = cv.parentElement;
    const w = bd.clientWidth, h = bd.clientHeight;
    if (!w || !h || (w === fitW && h === fitH)) return;
    fitW = w; fitH = h;
    const s = Math.min(w - 2, (h - 2) * 1.6);
    cv.style.width = Math.floor(s) + 'px';
    cv.style.height = Math.floor(s / 1.6) + 'px';
  }
  window.addEventListener('resize', fit);

  buildShop();
  buildMenu();
  refreshLoad();
  setMap(MAPS[0]);
  let last = now();
  function frame() {
    const t = now();
    const dt = Math.min(.05, t - last);
    last = t;
    if (S.playing && !S.over && $('start').hidden) {
      for (let i = 0; i < S.speed; i++) update(dt);
    }
    fit();
    draw(t);
    renderHud();
    if (S.sel && !$('sel').hidden) renderSel();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body></html>
